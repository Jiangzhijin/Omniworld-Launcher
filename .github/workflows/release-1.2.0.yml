name: Publish Omniworld 1.2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.2.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-1.2.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION_ROOT: '1.2'
      BUILD_NUMBER: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        shell: pwsh
        run: |
          ./gradlew.bat :HMCL:makeExecutables :HMCL:test --tests org.jackhuang.hmcl.setting.OmniworldPreferencesTest :HMCLCore:test --tests org.jackhuang.hmcl.auth.OAuthDeviceFlowTest --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests failed' }
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package,release -Force | Out-Null
          Copy-Item HMCL/build/libs/HMCL-1.2.0.exe package/Omniworld-1.2.0.exe
          Copy-Item HMCL/build/libs/HMCL-1.2.0.jar package/Omniworld-1.2.0.jar
          Copy-Item LICENSE package/LICENSE.txt
          Copy-Item README.md package/README.md
          Get-ChildItem package -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content package/SHA256SUMS.txt -Encoding utf8
          Compress-Archive -Path package/* -DestinationPath release/Omniworld-1.2.0-Windows.zip
          Copy-Item package/Omniworld-1.2.0.exe,package/Omniworld-1.2.0.jar release/
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: Omniworld-1.2.0-release
          path: release/*
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem release -File).FullName
          gh release create v1.2.0 @assets --target $env:GITHUB_SHA --title "Omniworld Launcher 1.2.0" --notes-file docs/releases/v1.2.0.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
